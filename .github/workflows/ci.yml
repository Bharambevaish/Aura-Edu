name: CI

# The merge gate from TASKLIST.md §7: typecheck + lint + unit tests +
# production build + the e2e demo story must pass on every push and PR.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Build-time placeholders only — the build does not connect to a database.
      MONGODB_URI: mongodb://127.0.0.1:27017/auraedu
      AUTH_SECRET: ci-build-placeholder-not-a-real-secret
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      # The e2e demo story needs the one-click logins and Reset (scripts/e2e-server.mjs sets it too).
      DEMO_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Throwaway in-memory MongoDB + seed + next start (scripts/e2e-server.mjs).
      - name: E2E demo story
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
