name: CI

# The merge gate from TASKLIST.md §7: typecheck + lint + production build
# must pass on every push and pull request.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders only — the build does not connect to a database.
      MONGODB_URI: mongodb://127.0.0.1:27017/auraedu
      AUTH_SECRET: ci-build-placeholder-not-a-real-secret
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
